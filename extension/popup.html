<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaizenFlow Shield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 290px;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #047857;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .toggle-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }
    .toggle-sub {
      font-size: 10px;
      color: #71717a;
      margin-top: 2px;
    }
    /* Switch component */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #3f3f46;
      transition: .2s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #ef4444;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .targets-box {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 11px;
    }
    .targets-title {
      color: #a1a1aa;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.05em;
    }
    .target-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag {
      background: #27272a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #d4d4d8;
      font-size: 10px;
    }
    .btn-open {
      width: 100%;
      background: #047857;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-open:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="brand-title">KaizenFlow Shield</span>
    </div>
    <span id="statusBadge" style="font-size: 10px; font-weight: 700; color: #71717a;">OFF</span>
  </div>

  <div class="toggle-card">
    <div>
      <div class="toggle-label">Isolation Mode</div>
      <div class="toggle-sub">Block social media across browser</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="isolationSwitch">
      <span class="slider"></span>
    </label>
  </div>

  <div class="targets-box">
    <div class="targets-title">Blocked in this browser:</div>
    <div class="target-tags">
      <span class="tag">facebook.com</span>
      <span class="tag">instagram.com</span>
      <span class="tag">whatsapp.com</span>
      <span class="tag">x.com</span>
      <span class="tag">tiktok.com</span>
    </div>
  </div>

  <button id="openAppBtn" class="btn-open">
    <span>Open KaizenFlow</span>
    <span>→</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
